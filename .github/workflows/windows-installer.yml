name: Build Windows setup.exe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - installer/windows/**
      - .github/workflows/windows-installer.yml
  pull_request:
    paths:
      - installer/windows/**
      - .github/workflows/windows-installer.yml
jobs:
  installer:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check Japanese source encoding
        shell: pwsh
        run: |
          $sourcePath = Join-Path $PWD 'installer/windows/setup.nsi'
          $sourceBytes = [System.IO.File]::ReadAllBytes($sourcePath)
          if ($sourceBytes.Length -lt 3 -or $sourceBytes[0] -ne 0xEF -or $sourceBytes[1] -ne 0xBB -or $sourceBytes[2] -ne 0xBF) {
            throw 'NSIS source must have a UTF-8 BOM.'
          }
          $utf8Strict = [System.Text.UTF8Encoding]::new($false, $true)
          $sourceText = $utf8Strict.GetString($sourceBytes)
          $appName = -join ([char[]](0x3053, 0x3068, 0x3070, 0x30E1, 0x30E2))
          if (-not $sourceText.Contains('Name "' + $appName + '"')) {
            throw 'Japanese application name does not match.'
          }
      - name: Install NSIS
        run: choco install nsis --no-progress -y
      - name: Build setup.exe
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /INPUTCHARSET UTF8 installer/windows/setup.nsi
          if ($LASTEXITCODE -ne 0) { throw 'NSIS build failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: kotoba-memo-windows-setup
          path: installer/windows/kotoba-memo-setup.exe
