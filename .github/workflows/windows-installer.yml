name: Build Windows setup.exe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/**', 'package*.json', '.github/workflows/windows-installer.yml']
  pull_request:
    paths: ['desktop/**', 'package*.json', '.github/workflows/windows-installer.yml']
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm install --prefix desktop
      - run: npm run dist:windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: kotoba-memo-windows-setup
          path: release/kotoba-memo-setup.exe
          if-no-files-found: error
