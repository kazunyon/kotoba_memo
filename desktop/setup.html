<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:"><title>ことばメモの初回設定</title><link rel="stylesheet" href="setup.css"></head>
<body><main>
<header class="wizard-header"><span class="brand">ことばメモ</span><button id="manual" class="quiet" type="button">図解マニュアル・印刷</button></header>
<section id="welcome"><p class="eyebrow">初回設定ガイド</p><h1>ひとつずつ、<br>一緒に準備します。</h1><p>Googleの設定は、最初の一度だけです。押す場所を図で確認し、コピーと貼り付けで進めます。</p><p class="note">Googleへのログイン、プロジェクトと請求先の設定は、ご本人の操作が必要です。利用量に応じてCloudの費用が発生します。</p><button id="start" type="button">最初から準備する</button><button id="resume" class="secondary" type="button" hidden>続きから再開する</button><button id="existing" class="quiet" type="button">設置済みのURLがある</button></section>
<section id="wizard" hidden><div class="progress"><span id="step-number"></span><progress id="progress" max="12" value="1"></progress></div><h1 id="step-title" tabindex="-1"></h1><p id="step-action" class="lead"></p><div id="action-area"></div><div id="diagram"></div><ol id="instructions"></ol><div id="confirmation"></div><nav class="wizard-nav"><button id="back" class="secondary" type="button">戻る</button><button id="next" type="button">次へ</button></nav><button id="pause" class="quiet" type="button">ここで休む・あとで続ける</button><details id="help"><summary>うまくいかないとき</summary><p>英語のエラー結果を貼り付けると、次の操作を案内します。秘密の値は貼り付けないでください。結果は保存しません。</p><textarea id="error-log" aria-label="エラー結果" rows="3"></textarea><button id="diagnose" class="secondary" type="button">次の操作を調べる</button><p id="diagnosis" role="status"></p></details></section>
<section id="existing-panel" hidden><h1>設置済みのアプリへ接続</h1><p>ご自身のCloudに設置したURLを貼り付けてください。</p><form id="connection-form"><label for="url">アプリURL</label><input id="url" type="url" required placeholder="https://…run.app"><button type="submit">接続を確認して開始</button></form><button id="existing-back" class="secondary" type="button">ガイドへ戻る</button></section>
<p id="status" role="status" aria-live="polite"></p><button id="recovery" type="button" class="secondary" hidden>修正する手順へ戻る</button>
</main><script src="setup-guide.js"></script><script src="setup-diagram.js"></script><script src="setup.js"></script></body></html>
